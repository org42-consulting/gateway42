{{define "content"}}
<div class="centered-page">
    <div class="card dialog-card confirm-card">
        <h2 class="confirm-title">Confirm Deletion</h2>
        <p class="confirm-text">
            You <strong>must</strong> export user data before deletion.
            This action cannot be undone.
        </p>
        <form action="/delete/{{.UID}}" method="post">
            <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
            <div class="flex-row">
                <a href="/export/{{.UID}}" class="btn btn-primary">Download CSV</a>
                <button type="submit" class="btn btn-danger">Delete Permanently</button>
                <a href="/admin/panel" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
