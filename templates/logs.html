{{define "content"}}

{{range .Flashes}}
<div class="flash flash-{{.Category}}">{{.Message}}</div>
{{end}}

<div class="card card-mt">
    <h2>Request Logs</h2>
    <!-- Search + refresh control -->
    <form method="get" action="/admin/logs" class="logs-search">
        <div class="toolbar-row">
            <input type="text" name="q" id="search-input" value="{{.Search}}" placeholder="Search client, path, IP, model or engine…" class="search-input">
            <button class="btn btn-primary" type="submit">Search</button>
            {{if .Search}}
                <a href="/admin/logs" class="btn btn-ghost">Clear</a>
            {{end}}
            <a href="/admin/export-logs" class="btn btn-primary">Export CSV</a>
            <button type="submit" form="reset-system-form" class="btn btn-danger"
                    onclick="return confirm('This will permanently delete all logs and reset all rate-limit counters. This cannot be undone. Continue?')">Reset System</button>
            <div class="toolbar-right">
                <label class="inline">Auto-refresh:</label>
                <select id="refresh-interval" class="select-sm">
                    <option value="0">Off</option>
                    <option value="5000">5s</option>
                    <option value="10000" selected>10s</option>
                    <option value="30000">30s</option>
                    <option value="60000">60s</option>
                </select>
                <span id="refresh-indicator" class="text-hint"></span>
            </div>
        </div>
    </form>
    <form id="reset-system-form" action="/admin/reset-system" method="post" class="is-hidden">
        <input type="hidden" name="_csrf" value="{{$.CSRFToken}}">
        <input type="hidden" name="next" value="admin_logs">
    </form>

    <div id="logs-table" class="table-wrap">
        <div class="table-empty">Loading…</div>
    </div>
    <div id="logs-pagination" class="pagination"></div>
    <p id="logs-count" class="table-count"></p>
</div>


<div class="card card-mt">
    <h2>System Logs</h2>
    <div class="toolbar">
        <input type="text" id="syslog-search" placeholder="Search message…" class="search-input">
        <button class="btn btn-primary" id="syslog-search-btn">Search</button>
        <button class="btn btn-ghost is-hidden" id="syslog-clear-btn">Clear</button>
        <a href="/admin/logs/system/export" id="syslog-export-btn" class="btn btn-primary">Export CSV</a>
        <button class="btn btn-danger" id="syslog-reset-btn">Reset Logs</button>
        <div class="toolbar-right">
            <label class="inline">Auto-refresh:</label>
            <select id="syslog-refresh-interval" class="select-sm">
                <option value="0">Off</option>
                <option value="5000">5s</option>
                <option value="10000" selected>10s</option>
                <option value="30000">30s</option>
                <option value="60000">60s</option>
            </select>
            <span id="syslog-refresh-indicator" class="text-hint"></span>
        </div>
    </div>

    <div id="syslog-table" class="table-wrap">
        <div class="table-empty">Loading…</div>
    </div>
    <div id="syslog-pagination" class="pagination"></div>
    <p id="syslog-count" class="table-count"></p>
</div>

{{end}}

{{define "scripts"}}
<script>
// ── Shared pagination helper ───────────────────────────────────────────────────
function buildPagination(paginationEl, page, pages, onPageChange) {
    if (pages <= 1) { paginationEl.innerHTML = ''; return; }

    const btn = (label, p, active, disabled) =>
        `<button class="page-btn${active ? ' is-current' : ''}" data-page="${p}"${disabled ? ' disabled' : ''}>${label}</button>`;
    const gap = '<span class="page-gap">…</span>';

    const lo = Math.max(1, page - 2), hi = Math.min(pages, page + 2);
    let html = btn('&#8592; Prev', page - 1, false, page <= 1);
    if (lo > 1)        html += btn('1', 1, false, false);
    if (lo > 2)        html += gap;
    for (let p = lo; p <= hi; p++) html += btn(p, p, p === page, false);
    if (hi < pages-1)  html += gap;
    if (hi < pages)    html += btn(pages, pages, false, false);
    html += btn('Next &#8594;', page + 1, false, page >= pages);

    paginationEl.innerHTML = html;
    paginationEl.querySelectorAll('button[data-page]').forEach(b => {
        if (!b.disabled) b.addEventListener('click', () => onPageChange(+b.dataset.page));
    });
}

// ── Request Logs ──────────────────────────────────────────────────────────────
(function () {
    const tableWrap  = document.getElementById('logs-table');
    const paginEl    = document.getElementById('logs-pagination');
    const countEl    = document.getElementById('logs-count');
    const select     = document.getElementById('refresh-interval');
    const indicator  = document.getElementById('refresh-indicator');
    const searchEl   = document.getElementById('search-input');

    let timerId = null;
    let currentPage = 1;
    // Request IDs whose detail row is open. Auto-refresh rebuilds the table,
    // and losing an open row mid-read on the next tick is maddening, so the
    // expanded state outlives the DOM it was set in.
    const expanded = new Set();

    function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Class for the status cell's colour; 2xx and anything else is the default.
    function statusClass(code) {
        if (code >= 500) return ' is-5xx';
        if (code >= 400) return ' is-4xx';
        if (code >= 300) return ' is-3xx';
        return '';
    }

    function fmtMs(ms) {
        if (!ms) return '—';
        return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
    }

    function fmtTokens(r) {
        if (!r.InTokens && !r.OutTokens) return '—';
        return `${r.InTokens || 0} → ${r.OutTokens || 0}`;
    }

    // Detail row: the facts that would not fit the table, shown on click.
    // Everything is escaped the same way as the cells above.
    function detailRow(r) {
        const model = r.ModelServed && r.ModelServed !== r.ModelRequested
            ? `${esc(r.ModelRequested)} → ${esc(r.ModelServed)}`
            : esc(r.ModelRequested || r.ModelServed || '—');
        const engine = r.EngineName
            ? `${esc(r.EngineName)} <span class="detail-dim">(${esc(r.EngineType)})</span>` : '—';
        const items = [
            ['Request ID', `<code>${esc(r.RequestID || '—')}</code>`],
            ['Model', model],
            ['Engine', engine],
            ['Streamed', r.Streamed ? 'yes' : 'no'],
            ['Time to first token', fmtMs(r.TTFTMs)],
            ['Duration', fmtMs(r.DurationMs)],
            ['Tokens in → out', fmtTokens(r)],
            ['Stop reason', esc(r.StopReason || '—')],
            ['Outcome', r.Outcome ? `<span class="is-4xx">${esc(r.Outcome)}</span>` : '—'],
            ['Upstream error', r.UpstreamError ? `<span class="is-5xx">${esc(r.UpstreamError)}</span>` : '—'],
            ['User agent', esc(r.UserAgent || '—')],
        ];
        const cells = items.map(([k, v]) =>
            `<div class="detail-item"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`
        ).join('');
        return `<tr class="log-detail-row${expanded.has(r.RequestID) ? '' : ' is-hidden'}"><td colspan="10"><div class="detail-grid">${cells}</div></td></tr>`;
    }

    function buildTable(logs, q) {
        if (!logs.length) return `<div class="table-empty">${
            q ? `No logs match <strong class="empty-term">${esc(q)}</strong>.`
              : 'No requests logged yet.'}</div>`;
        const rows = logs.map(r => {
            const ts = (r.TS || '').slice(0, 19).replace('T', ' ');
            return `<tr class="log-row" tabindex="0" title="Click for details" data-rid="${esc(r.RequestID || '')}">
                <td class="log-ts">${esc(ts)}</td>
                <td class="log-client">${esc(r.Name || '—')}</td>
                <td class="log-ip">${esc(r.ClientIP || '')}</td>
                <td class="log-method">${esc(r.Method || '')}</td>
                <td class="log-path">${esc(r.Path || '')}</td>
                <td class="log-model">${esc(r.ModelServed || r.ModelRequested || '—')}</td>
                <td class="log-engine">${esc(r.EngineName || '—')}</td>
                <td class="log-code${statusClass(r.Status)}">${esc(String(r.Status || ''))}</td>
                <td class="log-ms">${fmtMs(r.DurationMs)}</td>
                <td class="log-tokens">${fmtTokens(r)}</td>
            </tr>` + detailRow(r);
        }).join('');
        return `<div class="scroll-x"><table class="data-table">
            <thead><tr>
                <th class="col-160">Time</th><th class="col-140">Client</th>
                <th class="col-140">IP</th><th class="col-80">Method</th>
                <th>Path</th><th class="col-160">Model</th>
                <th class="col-120">Engine</th><th class="col-80">Status</th>
                <th class="col-80">Time</th><th class="col-110">Tokens</th>
            </tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    // One delegated listener survives table rebuilds; Enter mirrors click for
    // keyboard users (rows are focusable via tabindex).
    if (tableWrap) {
        const toggle = row => {
            const detail = row.nextElementSibling;
            if (!detail || !detail.classList.contains('log-detail-row')) return;
            const hidden = detail.classList.toggle('is-hidden');
            const rid = row.dataset.rid;
            if (!rid) return;
            if (hidden) expanded.delete(rid);
            else expanded.add(rid);
        };
        tableWrap.addEventListener('click', e => {
            const row = e.target.closest('.log-row');
            if (row) toggle(row);
        });
        tableWrap.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const row = e.target.closest('.log-row');
                if (row) toggle(row);
            }
        });
    }

    function goTo(p) { currentPage = p; refresh(); }

    async function refresh() {
        const q = searchEl ? searchEl.value.trim() : '';
        const params = new URLSearchParams({ page: currentPage });
        if (q) params.set('q', q);
        try {
            const resp = await fetch('/admin/logs/data?' + params);
            if (!resp.ok) return;
            const data = await resp.json();
            if (tableWrap) tableWrap.innerHTML = buildTable(data.logs || [], q);
            buildPagination(paginEl, data.page, data.pages, goTo);
            if (countEl) {
                const {total, page, pages} = data;
                const from = (page - 1) * 10 + 1, to = Math.min(page * 10, total);
                countEl.textContent = total
                    ? `Showing ${from}–${to} of ${total} entr${total === 1 ? 'y' : 'ies'}.`
                    : 'No entries.';
            }
            indicator.textContent = 'Updated ' + new Date().toLocaleTimeString();
        } catch (_) { indicator.textContent = 'Refresh failed'; }
    }

    function applyInterval(ms) {
        clearInterval(timerId); timerId = null;
        if (ms > 0) { timerId = setInterval(refresh, ms); indicator.textContent = 'Auto-refresh on'; }
        else indicator.textContent = '';
    }

    const form = document.querySelector('form[action="/admin/logs"]');
    if (form) form.addEventListener('submit', () => { currentPage = 1; });

    select.addEventListener('change', () => applyInterval(parseInt(select.value, 10)));
    refresh();
    applyInterval(parseInt(select.value, 10));
})();

// ── System Logs ───────────────────────────────────────────────────────────────
(function () {
    const tableWrap  = document.getElementById('syslog-table');
    const paginEl    = document.getElementById('syslog-pagination');
    const countEl    = document.getElementById('syslog-count');
    const select     = document.getElementById('syslog-refresh-interval');
    const indicator  = document.getElementById('syslog-refresh-indicator');
    const searchEl   = document.getElementById('syslog-search');
    const searchBtn  = document.getElementById('syslog-search-btn');
    const clearBtn   = document.getElementById('syslog-clear-btn');
    const exportBtn  = document.getElementById('syslog-export-btn');
    const resetBtn   = document.getElementById('syslog-reset-btn');

    let timerId = null;
    let currentQ = '';
    let currentPage = 1;

    function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Class for the level cell's colour.
    function levelClass(level) {
        if (level === 'ERROR' || level === 'ERROR+4') return ' is-error';
        if (level === 'WARN'  || level === 'WARN+4')  return ' is-warn';
        return ' is-info';
    }

    function buildTable(logs, q) {
        if (!logs.length) return `<div class="table-empty">${
            q ? `No entries match <strong class="empty-term">${esc(q)}</strong>.`
              : 'No system log entries yet.'}</div>`;
        const rows = logs.map(r => `<tr>
            <td class="log-ts">${esc(r.ts || '')}</td>
            <td class="log-code${levelClass(r.level)}">${esc(r.level || '')}</td>
            <td class="log-logger">${esc(r.name || '')}</td>
            <td>${esc(r.msg || '')}</td>
        </tr>`).join('');
        return `<div class="scroll-x"><table class="data-table">
            <thead><tr>
                <th class="col-160">Time</th><th class="col-90">Level</th>
                <th class="col-200">Logger</th><th>Message</th>
            </tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function updateExportUrl(q) {
        exportBtn.href = '/admin/logs/system/export' + (q ? '?q=' + encodeURIComponent(q) : '');
    }

    function goTo(p) { currentPage = p; refresh(); }

    async function refresh() {
        const params = new URLSearchParams({ page: currentPage });
        if (currentQ) params.set('q', currentQ);
        try {
            const resp = await fetch('/admin/logs/system?' + params);
            if (!resp.ok) return;
            const data = await resp.json();
            if (tableWrap) tableWrap.innerHTML = buildTable(data.logs || [], currentQ);
            buildPagination(paginEl, data.page, data.pages, goTo);
            if (countEl) {
                const {total, page} = data;
                const from = (page - 1) * 10 + 1, to = Math.min(page * 10, total);
                countEl.textContent = total
                    ? `Showing ${from}–${to} of ${total} entr${total === 1 ? 'y' : 'ies'}.`
                    : 'No entries.';
            }
            indicator.textContent = 'Updated ' + new Date().toLocaleTimeString();
        } catch (_) { indicator.textContent = 'Refresh failed'; }
    }

    function applyInterval(ms) {
        clearInterval(timerId); timerId = null;
        if (ms > 0) { timerId = setInterval(refresh, ms); indicator.textContent = 'Auto-refresh on'; }
        else indicator.textContent = '';
    }

    function doSearch() {
        currentQ = searchEl.value.trim();
        currentPage = 1;
        clearBtn.classList.toggle('is-hidden', !currentQ);
        updateExportUrl(currentQ);
        refresh();
    }

    searchBtn.addEventListener('click', doSearch);
    searchEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

    clearBtn.addEventListener('click', () => {
        searchEl.value = ''; currentQ = ''; currentPage = 1;
        clearBtn.classList.add('is-hidden');
        updateExportUrl('');
        refresh();
    });

    resetBtn.addEventListener('click', async () => {
        if (!confirm('This will permanently clear all in-memory system log entries. Continue?')) return;
        try {
            await fetch('/admin/logs/system/reset', {
                method: 'POST',
                headers: {'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content},
            });
            currentPage = 1;
            refresh();
        } catch (_) { indicator.textContent = 'Reset failed'; }
    });

    select.addEventListener('change', () => applyInterval(parseInt(select.value, 10)));
    refresh();
    applyInterval(parseInt(select.value, 10));
})();
</script>
{{end}}
