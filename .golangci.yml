version: "2"

linters:
  default: standard
  enable:
    # Unchecked errors are the failure mode this codebase is most exposed to:
    # log writes, session saves and upstream reads all return errors that are
    # easy to drop silently.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # bodyclose catches a leaked http.Response.Body, which in a gateway leaks
    # a pooled connection per request rather than just memory.
    - bodyclose

  settings:
    errcheck:
      exclude-functions:
        # A failed write or flush to an already-disconnected client has no
        # recovery path: the response is gone either way, and the only place an
        # error could be reported to is the connection that just died. This
        # covers the whole response-writing family, including the SSE error
        # frame recoveryMiddleware emits mid-stream.
        - (net/http.Flusher).Flush
        - (net/http.ResponseWriter).Write
        - (*encoding/csv.Writer).Write
        - fmt.Fprint
        - fmt.Fprintf
        # Rolling back an already-committed transaction is the standard defer
        # idiom and returns sql.ErrTxDone by design. Note the pointer receiver:
        # the calls are on *sql.Tx, and the interface-style spelling
        # `(database/sql.Tx).Rollback` silently matches nothing at all.
        - (*database/sql.Tx).Rollback
    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      # Tests may ignore errors where the assertion is the point.
      - path: _test\.go
        linters:
          - errcheck

      # A *deferred* Close is a release, not an operation. It runs after the
      # value has been fully read, there is no caller left to return to, and
      # the failure that actually costs something — a response body never
      # closed at all, which strands a pooled connection per request — is
      # bodyclose's job and bodyclose is enabled above.
      #
      # This is deliberately keyed on `defer` rather than on the closer types,
      # so a Close that is *not* deferred stays checked: writing one is a
      # decision about ordering (release this cursor before the next write,
      # close this body before returning the error) and those calls are the
      # ones where a failure says something.
      - source: '^\s*defer .*\.Close\(\)$'
        linters:
          - errcheck

issues:
  # Report everything rather than the default per-linter cap; the codebase is
  # small enough that a truncated list would hide real findings.
  max-issues-per-linter: 0
  max-same-issues: 0
